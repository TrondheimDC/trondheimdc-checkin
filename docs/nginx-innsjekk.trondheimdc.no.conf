# Example nginx site for https://innsjekk.trondheimdc.no
# Place on the VPS (same box as utlegg), e.g.:
#   /etc/nginx/sites-available/innsjekk.trondheimdc.no
#   sudo ln -s /etc/nginx/sites-available/innsjekk.trondheimdc.no /etc/nginx/sites-enabled/
# Then obtain TLS with certbot (or adapt if you already use a wildcard cert).
#
# Upstream is the Compose-published port (see docker-compose.yml):
#   127.0.0.1:3010 → container :3000

upstream innsjekk {
  server 127.0.0.1:3010;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name innsjekk.trondheimdc.no;

  # After certbot: this block usually becomes a redirect to HTTPS.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name innsjekk.trondheimdc.no;

  # certbot --nginx will fill these in; placeholders shown for clarity:
  # ssl_certificate     /etc/letsencrypt/live/innsjekk.trondheimdc.no/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/innsjekk.trondheimdc.no/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Smooth Print APK upload (zip/apk) — keep above default 1m
  client_max_body_size 100m;

  location / {
    proxy_pass http://innsjekk;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Next.js / better-auth cookies & redirects need the public origin
    proxy_redirect off;

    # Long-ish for APK download / upload
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # WebSocket (Next / HMR not used in prod, but harmless)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# In http {} context (often already present on shared nginx):
# map $http_upgrade $connection_upgrade {
#   default upgrade;
#   ''      close;
# }
